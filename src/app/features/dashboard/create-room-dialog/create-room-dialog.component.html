<p-dialog 
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{width: '500px'}"
  header="Crear Nueva Sala"
  (onHide)="hide()"
>
  <form [formGroup]="roomForm" (ngSubmit)="onSubmit()">
    <div class="form-content">
      <!-- Nombre de la sala -->
      <div class="field">
        <label for="roomName" class="field-label">
          Nombre de la sala <span class="required">*</span>
        </label>
        <input 
          pInputText 
          id="roomName" 
          formControlName="name"
          placeholder="Ej: Sprint 24 - Estimación"
          class="w-full"
          [class.ng-invalid]="nameControl?.invalid && nameControl?.touched"
        />
        <small 
          *ngIf="nameControl?.invalid && nameControl?.touched" 
          class="error-message"
        >
          <span *ngIf="nameControl?.errors?.['required']">El nombre es requerido</span>
          <span *ngIf="nameControl?.errors?.['minlength']">El nombre debe tener al menos 3 caracteres</span>
          <span *ngIf="nameControl?.errors?.['maxlength']">El nombre no puede exceder 100 caracteres</span>
        </small>
      </div>

      <!-- Descripción -->
      <div class="field">
        <label for="roomDescription" class="field-label">
          Descripción (opcional)
        </label>
        <textarea 
          pInputTextarea 
          id="roomDescription" 
          formControlName="description"
          placeholder="Describe el propósito de esta sala..."
          rows="4"
          class="w-full"
          [class.ng-invalid]="descriptionControl?.invalid && descriptionControl?.touched"
        ></textarea>
        <small 
          *ngIf="descriptionControl?.invalid && descriptionControl?.touched" 
          class="error-message"
        >
          <span *ngIf="descriptionControl?.errors?.['maxlength']">La descripción no puede exceder 500 caracteres</span>
        </small>
      </div>

      <!-- Info -->
      <div class="info-box">
        <i class="pi pi-info-circle"></i>
        <span>Se generará un código único de 6 caracteres para compartir esta sala con tu equipo.</span>
      </div>
    </div>

    <!-- Footer con botones -->
    <div class="dialog-footer">
      <p-button 
        label="Cancelar" 
        (onClick)="hide()"
        [text]="true"
        severity="secondary"
        [disabled]="loading"
      ></p-button>
      <p-button 
        label="Crear Sala" 
        type="submit"
        icon="pi pi-check"
        [loading]="loading"
        [disabled]="loading"
      ></p-button>
    </div>
  </form>
</p-dialog>
