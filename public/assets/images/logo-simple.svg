<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fondo transparente -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Carta de póker dorada -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="70" height="100" rx="6" fill="#d4a574" stroke="#1e3a5f" stroke-width="2"/>
    <!-- As de espadas pequeño -->
    <path d="M 12 15 L 18 18 L 18 22 L 15 25 L 12 22 Z" fill="#1e3a5f"/>
    <!-- As de espadas grande -->
    <path d="M 15 45 L 25 60 L 20 75 L 10 75 L 5 60 L 15 45 Z" fill="#1e3a5f"/>
    <!-- As pequeño abajo -->
    <path d="M 55 80 L 58 82 L 58 85 L 56.5 86.5 L 55 85 Z" fill="#1e3a5f"/>
  </g>
  
  <!-- Flecha con infinito azul -->
  <g transform="translate(85, 55)">
    <!-- Flecha dorada -->
    <path d="M 0 35 L 35 0 L 42 5 L 48 0 L 83 35 L 77 42 L 48 13" 
          fill="#d4a574" stroke="#d4a574" stroke-width="5" 
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Símbolo infinito azul -->
    <path d="M 12 60 Q 18 50 30 55 T 48 60 Q 54 70 42 65 T 24 60 Q 18 50 30 55" 
          fill="none" stroke="#1e3a5f" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
