<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="checkerboard" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="20" height="20" fill="#e5e7eb"/>
      <rect x="20" y="0" width="20" height="20" fill="#f3f4f6"/>
      <rect x="0" y="20" width="20" height="20" fill="#f3f4f6"/>
      <rect x="20" y="20" width="20" height="20" fill="#e5e7eb"/>
    </pattern>
  </defs>
  
  <rect width="512" height="512" fill="url(#checkerboard)"/>
  
  <!-- Carta de póker -->
  <g transform="translate(180, 200)">
    <rect x="0" y="0" width="120" height="180" rx="8" fill="#d4a574" stroke="#1e3a5f" stroke-width="3"/>
    <path d="M 20 30 L 30 35 L 30 40 L 25 45 L 20 40 L 20 30 Z" fill="#1e3a5f"/>
    <path d="M 25 90 L 40 110 L 30 130 L 15 130 L 5 110 L 20 90 Z" fill="#1e3a5f"/>
    <path d="M 90 150 L 95 155 L 95 160 L 92.5 162.5 L 90 160 L 90 150 Z" fill="#1e3a5f"/>
  </g>
  
  <!-- Flecha de infinito -->
  <g transform="translate(280, 230)">
    <!-- Flecha -->
    <path d="M 0 60 L 60 0 L 70 10 L 80 0 L 140 60 L 130 70 L 80 20" fill="#d4a574" stroke="#d4a574" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Símbolo infinito -->
    <path d="M 20 100 Q 30 80 50 90 T 80 100 Q 90 120 70 110 T 40 100 Q 30 80 50 90" fill="none" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
